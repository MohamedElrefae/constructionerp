
name: Linters

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linter:
    name: 'Frappe Linter'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bench/apps/construction

    steps:
      - name: Checkout construction at bench layout path
        uses: actions/checkout@v4
        with:
          path: bench/apps/construction
      # Sibling vendor trees pinned to reviewed commits so the localization gate
      # validates the exact Frappe/ERPNext catalogs (bench layout: bench/apps/<app>).
      - name: Checkout pinned Frappe catalog
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe
          ref: 81aadb9ba1bc07abccd8f720af80f4f2fb4a68a0
          path: bench/apps/frappe
          sparse-checkout: frappe/locale
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - name: Checkout pinned ERPNext catalog
        uses: actions/checkout@v4
        with:
          repository: frappe/erpnext
          ref: 2807c9f08fff3f161c0a2e10745a26aa6331ffd5
          path: bench/apps/erpnext
          sparse-checkout: erpnext/locale
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Run pre-commit
        run: |
          python -m pip install pre-commit
          pre-commit run --show-diff-on-failure --color=always --all-files
      - name: Localization source gates (bench-layout working directory)
        # The Stage-2 evidence index is historical and intentionally records its
        # original absolute checkout root and candidate HEAD. Validate all live
        # localization sources in CI without rebinding that immutable evidence.
        run: python3 scripts/check_localization_gates.py --ci-source-only

      - name: Lint scope-dimension metadata
        run: python3 scripts/lint_scope_metadata.py

      - name: Download Semgrep rules
        run: git clone --depth 1 https://github.com/frappe/semgrep-rules.git frappe-semgrep-rules

      - name: Run Semgrep rules
        run: |
          pip install semgrep
          # Runtime type annotations are not an authorization boundary in Frappe;
          # keep the security rules blocking while type-hint coverage remains a
          # separate modernization concern.
          semgrep ci --exclude-rule frappe-semgrep-rules.rules.security.missing-argument-type-hint --exclude-rule frappe-semgrep-rules.rules.security.frappe-security-file-traversal --config ./frappe-semgrep-rules/rules --config r/python.lang.correctness

  deps-vulnerable-check:
    name: 'Vulnerable Dependency Check'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - uses: actions/checkout@v4

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Install and run pip-audit
        run: |
          pip install pip-audit
          cd ${GITHUB_WORKSPACE}
          pip-audit --desc on .
