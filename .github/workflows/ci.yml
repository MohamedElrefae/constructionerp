name: CI

on:
  push:
    branches:
      - develop
      - main
      - codex/customer-release-ci-*
  pull_request:
  workflow_dispatch:

concurrency:
  group: construction-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
    name: Server

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          # Frappe version-16 currently requires Python >=3.14,<3.15.
          python-version: '3.14'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Frappe v16's package.json requires Node >=24.
          node-version: 24
          check-latest: true

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Install MariaDB build dependencies
        # Frappe v16's mysqlclient dependency builds from source on Linux/Python 3.14.
        # The VO business suite renders an actual PDF; provide its native
        # renderer and Arabic fonts rather than silently skipping that test.
        run: sudo apt-get update && sudo apt-get install -y mariadb-client default-libmysqlclient-dev build-essential pkg-config wkhtmltopdf fonts-noto-core

      - name: Install uv
        run: pip install uv

      - name: Setup
        run: |
          pip install frappe-bench
          bench init --skip-redis-config-generation --skip-assets --frappe-branch version-16 --python "$(which python)" ~/frappe-bench
          git -C ~/frappe-bench/apps/frappe fetch --depth=1 upstream 81aadb9ba1bc07abccd8f720af80f4f2fb4a68a0
          git -C ~/frappe-bench/apps/frappe checkout --detach FETCH_HEAD
          test "$(git -C ~/frappe-bench/apps/frappe rev-parse HEAD)" = 81aadb9ba1bc07abccd8f720af80f4f2fb4a68a0
          cd ~/frappe-bench
          bench setup requirements frappe
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"
        # Bench attempts to reload Supervisor after each app install.  CI has
        # supervisorctl but no running Supervisor service, so use Bench's
        # documented build guard to suppress process-manager reloads.
        env:
          FRAPPE_DOCKER_BUILD: '1'

      - name: Install
        working-directory: /home/runner/frappe-bench
        run: |
          # Pin before Bench installs dependencies or builds assets: building
          # the moving branch first can modify its lockfile and block checkout.
          git init "$RUNNER_TEMP/erpnext"
          git -C "$RUNNER_TEMP/erpnext" fetch --depth=1 https://github.com/frappe/erpnext 2807c9f08fff3f161c0a2e10745a26aa6331ffd5
          git -C "$RUNNER_TEMP/erpnext" checkout -b ci-pin FETCH_HEAD
          bench get-app --skip-assets erpnext "$RUNNER_TEMP/erpnext" --branch ci-pin
          test "$(git -C apps/erpnext rev-parse HEAD)" = 2807c9f08fff3f161c0a2e10745a26aa6331ffd5
          bench setup requirements frappe erpnext
          bench get-app construction $GITHUB_WORKSPACE
          bench setup requirements --dev
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site install-app erpnext
          # Bound fresh-install stalls and retain Python stacks on timeout.
          timeout --signal=ABRT --kill-after=15s 300s bench --verbose --site test_site install-app construction
          bench build
        env:
          CI: 'Yes'
          PYTHONUNBUFFERED: '1'
          PYTHONFAULTHANDLER: '1'
          FRAPPE_DOCKER_BUILD: '1'

      - name: Verify App Installation
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site list-apps | grep construction
          echo "Construction app installed successfully"

      - name: Run Python Business Regression Tests
        working-directory: /home/runner/frappe-bench
        run: |
          set -euo pipefail
          bench --site test_site set-config allow_tests true
          modules=(
            construction.tests.test_boq_properties
            construction.tests.test_quantity_revisions
            construction.tests.test_variation_orders
            construction.tests.test_cost_analysis_engine
            construction.tests.test_cost_database_api
            construction.tests.test_customer_release_financial_guards
            construction.tests.test_boq_transactions
            construction.tests.test_boq_wbs_generation
            construction.tests.test_boq_structure_conversion
            construction.tests.test_boq_structure_delete_safety
            construction.tests.test_boq_excel_parser
            construction.tests.test_boq_rollup_audit
            construction.tests.test_bilingual_install_schema
            construction.tests.test_boq_legacy_cost_conversion
            construction.tests.test_boq_parent_permissions
            construction.tests.test_bilingual_desk_link_dispatch
            construction.tests.test_stage7_bilingual_reports
          )
          for module in "${modules[@]}"; do
            bench --site test_site run-tests --app construction --module "$module"
          done

      - name: Run JS Property Tests
        working-directory: /home/runner/frappe-bench/apps/construction/construction/tests
        run: |
          npm ci --no-audit --no-fund
          node --test --test-isolation=none test_print_settings_properties.js
