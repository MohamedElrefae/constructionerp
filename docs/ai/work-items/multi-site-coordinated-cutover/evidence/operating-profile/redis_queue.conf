# Production redis_queue.conf — isolated bench operating profile (G15)
# Runs dedicated queue redis on 12000; never collide with system redis 6379
# nor the dev bench ephemeral ports 11000/13000.
bind 127.0.0.1
port 12000
protected-mode yes
dir /var/lib/frappe-prod/redis
dbfilename dump-queue.rdb
appendonly yes
appendfilename "appendonly.aof"
maxmemory 256mb
maxmemory-policy noeviction
timeout 300
tcp-keepalive 60
loglevel notice
logfile /var/log/frappe-prod/redis-queue.log
save 900 1
save 300 10
save 60 10000
